
name: Deploy WorkForge

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to EC2 through SSM
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2

      - name: Verify EC2 instance
        run: |
          aws ec2 describe-instances \
            --instance-ids i-04e9c3916efe14b9d \
            --query "Reservations[0].Instances[0].{InstanceId:InstanceId,State:State.Name}" \
            --output table

      - name: Deploy on EC2 with health check and rollback
        run: |
          aws ssm send-command \
            --instance-ids "i-04e9c3916efe14b9d" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy WorkForge with health check and rollback" \
            --parameters 'commands=[
              "sudo -u ubuntu /home/ubuntu/deploy-workforge.sh"
            ]' \
            --query "Command.CommandId" \
            --output text
